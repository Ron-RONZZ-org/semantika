# Unit ontology for Semantika — type hierarchy, SI base/derived units, SI prefixes.
#
# Editable source of truth.  Required predicates (:symbol, :multiplier, etc.)
# have a Python fallback — deleting them here will trigger a warning but
# the app still functions.
#
# Symbol, ucum, multiplier, and offset values are stored as triples using
# the predicates :symbol, :ucumCode, :multiplier, :offset.

version: 1

# ── Unit type hierarchy ──────────────────────────────────────────────

unit_types:
  - id: :UnitType
    labels: {en: Unit type, eo: Unuotipo}
    parent: null

  - id: :SingularUnit
    labels: {en: Singular unit, eo: Baza unuo}
    parent: :UnitType

  - id: :PrefixedUnit
    labels: {en: Prefixed unit, eo: Prefiksita unuo}
    parent: :UnitType
    also_type: :SingularUnit

  - id: :CompoundUnit
    labels: {en: Compound unit, eo: Kombinita unuo}
    parent: :UnitType

  - id: :UnitProduct
    labels: {en: Unit product, eo: Unuoprodukto}
    parent: :CompoundUnit

  - id: :UnitPower
    labels: {en: Unit power, eo: Unuopotenco}
    parent: :CompoundUnit

# ── SI base units ───────────────────────────────────────────────────

base_units:
  - id: unit:METER
    labels: {en: meter, eo: metro}
    symbol: m
    ucum: m
  - id: unit:KILOGRAM
    labels: {en: kilogram, eo: kilogramo}
    symbol: kg
    ucum: kg
  - id: unit:SECOND
    labels: {en: second, eo: sekundo}
    symbol: s
    ucum: s
  - id: unit:AMPERE
    labels: {en: ampere, eo: ampero}
    symbol: A
    ucum: A
  - id: unit:KELVIN
    labels: {en: kelvin, eo: kelvino}
    symbol: K
    ucum: K
  - id: unit:MOLE
    labels: {en: mole, eo: molo}
    symbol: mol
    ucum: mol
  - id: unit:CANDELA
    labels: {en: candela, eo: kandelo}
    symbol: cd
    ucum: cd

